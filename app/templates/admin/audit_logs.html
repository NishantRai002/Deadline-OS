{% extends "base.html" %}
{% block title %}Audit Logs — DeadlineOS{% endblock %}

{% block content %}
<!--
  Audit Logs Table
  Author (Frontend): Yuvraj
-->
<h4 class="fw-bold mb-4"><i class="bi bi-journal-text text-secondary me-2"></i>Audit Logs</h4>
<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-sm table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th><th>User</th><th>Action</th><th>Time</th>
          </tr>
        </thead>
        <tbody>
          {% for log in logs %}
          <tr>
            <td class="text-muted small">{{ log[0] }}</td>
            <td>{{ log[1] }}</td>
            <td><code>{{ log[2] }}</code></td>
            <td class="text-muted small">{{ log[3].strftime('%d %b %Y %H:%M') if log[3] else '' }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
<a href="{{ url_for('admin.index') }}" class="btn btn-outline-secondary mt-3">
  <i class="bi bi-arrow-left me-1"></i>Back to Admin
</a>
{% endblock %}
