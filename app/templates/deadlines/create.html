{% extends "base.html" %}
{% block title %}Add Deadline — DeadlineOS{% endblock %}

{% block content %}
<!--
  Create Deadline Form
  Author (Frontend): Yuvraj
-->
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-4"><i class="bi bi-plus-circle text-primary me-2"></i>Add New Deadline</h4>
        <form method="POST" action="{{ url_for('deadlines.create') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Title</label>
            <input type="text" name="title" class="form-control" placeholder="e.g. DBMS Lab Assignment 2" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Course / Subject</label>
            <input type="text" name="course_name" class="form-control" placeholder="e.g. Database Management Systems" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Due Date & Time</label>
            <input type="datetime-local" name="due_date" class="form-control" required />
          </div>
          <div class="row g-2 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Target Program <span class="text-muted small">(leave blank = all)</span></label>
              <input type="text" name="target_program" class="form-control" placeholder="e.g. BCA" />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Target Semester <span class="text-muted small">(leave blank = all)</span></label>
              <select name="target_semester" class="form-select">
                <option value="">— All —</option>
                {% for s in range(1, 9) %}
                <option value="{{ s }}">Semester {{ s }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
            <a href="{{ url_for('deadlines.list_all') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
