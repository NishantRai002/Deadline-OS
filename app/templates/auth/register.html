{% extends "base.html" %}
{% block title %}Register — DeadlineOS{% endblock %}

{% block content %}
<!--
  Registration Page
  Author (Frontend): Yuvraj
-->
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body p-4">
        <h3 class="fw-bold text-primary mb-1"><i class="bi bi-person-plus"></i> Create Account</h3>
        <p class="text-muted small mb-4">Fill in your details to get started.</p>

        <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name</label>
              <input type="text" name="full_name" class="form-control" placeholder="Ravi Verma" required />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" class="form-control" placeholder="you@university.edu" required />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" name="password" class="form-control" placeholder="Min. 8 characters" required />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Role</label>
              <select name="role" class="form-select" id="roleSelect">
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
              </select>
            </div>

            <!-- Student-only fields shown via JS -->
            <div id="studentFields">
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Program</label>
                  <input type="text" name="program" class="form-control" placeholder="e.g. BCA" />
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Semester</label>
                  <select name="semester" class="form-select">
                    <option value="">— Any —</option>
                    {% for s in range(1, 9) %}
                    <option value="{{ s }}">Semester {{ s }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Section</label>
                  <input type="text" name="section" class="form-control" placeholder="e.g. A" maxlength="5" />
                </div>
              </div>
            </div>
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-check2-circle me-1"></i>Register
            </button>
          </div>
        </form>

        <p class="text-center small mt-3 mb-0">
          Already have an account?
          <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Hide student fields for faculty — Yuvraj
  const roleSelect = document.getElementById('roleSelect');
  const studentFields = document.getElementById('studentFields');
  roleSelect.addEventListener('change', () => {
    studentFields.style.display = roleSelect.value === 'student' ? '' : 'none';
  });
</script>
{% endblock %}
