{% extends "base.html" %}
{% block title %}Login — DeadlineOS{% endblock %}

{% block content %}
<!--
  Login Page
  Author (Frontend): Yuvraj
-->
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 mt-5">
      <div class="card-body p-4">
        <h2 class="card-title text-center mb-1 fw-bold text-primary">
          <i class="bi bi-clock-history"></i> DeadlineOS
        </h2>
        <p class="text-center text-muted small mb-4">Sign in to your account</p>

        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="you@university.edu" required />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" id="passwordField" class="form-control" placeholder="••••••••" required />
              <button class="btn btn-outline-secondary" type="button" id="togglePwd">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-box-arrow-in-right me-1"></i>Login
            </button>
          </div>
        </form>

        <hr class="my-3" />
        <p class="text-center small mb-0">
          Don't have an account?
          <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold">Register here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Toggle password visibility — Yuvraj
  document.getElementById('togglePwd').addEventListener('click', function () {
    const field = document.getElementById('passwordField');
    const icon = this.querySelector('i');
    if (field.type === 'password') {
      field.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      field.type = 'password';
      icon.className = 'bi bi-eye';
    }
  });
</script>
{% endblock %}
