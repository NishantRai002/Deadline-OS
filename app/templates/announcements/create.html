{% extends "base.html" %}
{% block title %}Post Notice — DeadlineOS{% endblock %}

{% block content %}
<!--
  Create Announcement Form
  Author (Frontend): Yuvraj
-->
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-4"><i class="bi bi-megaphone text-primary me-2"></i>Post a Notice</h4>
        <form method="POST" action="{{ url_for('announcements.create') }}" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label fw-semibold">Title</label>
            <input type="text" name="title" class="form-control" placeholder="Notice title" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Body</label>
            <textarea name="body" class="form-control" rows="6"
                      placeholder="Write the full announcement here…" required></textarea>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Program <span class="text-muted small">(optional)</span></label>
              <input type="text" name="target_program" class="form-control" placeholder="e.g. BCA" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Semester <span class="text-muted small">(optional)</span></label>
              <select name="target_semester" class="form-select">
                <option value="">— All —</option>
                {% for s in range(1, 9) %}
                <option value="{{ s }}">Semester {{ s }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Section <span class="text-muted small">(optional)</span></label>
              <input type="text" name="target_section" class="form-control" placeholder="e.g. A" maxlength="5" />
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Attachment <span class="text-muted small">(PDF / DOCX, optional)</span></label>
            <input type="file" name="attachment" class="form-control" accept=".pdf,.doc,.docx,.png,.jpg" />
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Post</button>
            <a href="{{ url_for('announcements.list_all') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
